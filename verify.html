<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta name="theme-color" content="#050505" />

  <title>SarlaYash | Credential Verification</title>

  <meta
    name="description"
    content="Verify an official SarlaYash learning credential."
  />

  <link
    rel="stylesheet"
    href="/src/verify.css"
  />
</head>

<body>

  <main id="verify-app">

    <section class="verify-shell">

      <div class="live">
        <span></span>
        LIVE VERIFICATION
      </div>

      <img
        class="logo"
        src="/assets/sarlayash-logo.png"
        alt="SarlaYash Learning Solutions LLP"
      />

      <p class="eyebrow">
        SARLAYASH CREDENTIAL AUTHORITY
      </p>

      <h1>
        Credential
        <em>Verification.</em>
      </h1>

      <p class="intro">
        Authenticating credential against the
        SarlaYash verification registry.
      </p>

      <div
        id="verification-result"
        class="verification-card loading"
      >

        <div class="loader"></div>

        <p>
          VERIFYING CREDENTIAL
        </p>

      </div>

      <footer>
        <strong>
          SARLAYASH LEARNING SOLUTIONS LLP
        </strong>

        <span>
          Legacy of Values. Future of Learning.
        </span>
      </footer>

    </section>

  </main>

  <script
    type="module"
    src="/src/verify.js"
  ></script>

</body>
</html>
